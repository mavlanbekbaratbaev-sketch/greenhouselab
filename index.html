<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Smart Greenhouse — Dashboard</title>
  <!-- Подключение Chart.js для графиков -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #07111f; --panel: #0d1b2d; --text: #eef6ff; --muted: #9fb4ca;
      --line: #203a57; --accent: #36a3ff; --green: #72e0c4; --red: #ff7070;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Inter, Segoe UI, Arial, sans-serif; color: var(--text);
      background: linear-gradient(180deg, #06101d 0%, #091728 45%, #07111f 100%); line-height: 1.6;
    }
    .container { width: min(1180px, 92%); margin: auto; }
    header { padding: 30px 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 24px; color: var(--green); }
    nav.sticky { position: sticky; top: 0; z-index: 30; background: rgba(7, 17, 31, 0.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .navrow { display: flex; gap: 10px; overflow: auto; padding: 12px 0; }
    .navrow a { text-decoration: none; color: var(--muted); padding: 8px 12px; border-radius: 8px; font-size: 14px; }
    .navrow a:hover { background: var(--panel); color: #fff; }
    section { padding: 40px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .card { background: rgba(13, 27, 45, 0.84); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
    .card h3 { margin-top: 0; color: var(--muted); font-size: 14px; text-transform: uppercase; }
    .value { font-size: 28px; font-weight: bold; margin-top: 8px; }
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .chart-container { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; height: 320px; position: relative; }
    @media(max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="container">
    <h1>🌱 IoT Smart Greenhouse</h1>
    <div style="font-size: 14px; color: var(--muted);">Режим: <span style="color: var(--green); font-weight: bold;">AUTO</span></div>
  </header>

  <nav class="sticky">
    <div class="container navrow">
      <a href="greenhouse.html">Dashboard</a>
      <a href="greenhouse.html">Зоны</a>
      <a href="greenhouse.html">Управление</a>
      <a href="greenhouse.html">Аналитика</a>
      <a href="greenhouse.html">Настройки</a>
    </div>
  </nav>

  <main class="container">
    <!-- Секция KPI карточек датчиков -->
    <section id="dashboard">
      <h2>Текущие показатели</h2>
      <div class="grid">
        <div class="card">
          <h3>Температура воздуха</h3>
          <div class="value" id="val-temp">24.8 °C</div>
        </div>
        <div class="card">
          <h3>Влажность воздуха</h3>
          <div class="value" id="val-humidity">67 %</div>
        </div>
        <div class="card">
          <h3>Влажность почвы</h3>
          <div class="value" id="val-soil">42 %</div>
        </div>
        <div class="card">
          <h3>Уровень воды в баке</h3>
          <div class="value" id="val-water">72 %</div>
        </div>
      </div>
    </section>

    <!-- Секция графиков Chart.js -->
    <section id="analytics">
      <h2>История параметров</h2>
      <div class="charts-grid">
        <div class="chart-container">
          <canvas id="tempChart"></canvas>
        </div>
        <div class="chart-container">
          <canvas id="soilChart"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Инициализация графиков Chart.js для лабораторной[cite: 1]
    const ctxTemp = document.getElementById('tempChart').getContext('2d');
    new Chart(ctxTemp, {
      type: 'line',
      data: {
        labels: ['10:00', '10:05', '10:10', '10:15'],
        datasets: [{
          label: 'Температура (°C)',
          data: [23.1, 23.8, 24.2, 24.8],
          borderColor: '#36a3ff',
          tension: 0.35,
          fill: false
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });

    const ctxSoil = document.getElementById('soilChart').getContext('2d');
    new Chart(ctxSoil, {
      type: 'line',
      data: {
        labels: ['10:00', '10:05', '10:10', '10:15'],
        datasets: [{
          label: 'Влажность почвы (%)',
          data: [45, 44, 43, 42],
          borderColor: '#72e0c4',
          tension: 0.35,
          fill: false
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  </script>
</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
